<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- .ico first: it is the one format every browser accepts without
         argument, and several ignore an SVG-only icon entirely. The SVG is
         offered after it for browsers that prefer a scalable icon. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#571F85" />
    <title>ShopNear — shops near you</title>
    <meta name="description" content="Find what you need at the shop next door. Reserve it, walk over, collect and pay." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
